# Light-volume scenario: ~60 % of the balanced profile (peak ~145 veh/h/lane).
# Queues form at the peaks but clear within a cycle or two.
name: light
seed: 42
time: {day_seconds: 86400, time_scale: 1.0, step_length_s: 1.0}
curve:
  night_veh_h_lane: 10
  day_veh_h_lane: 55
  day_start_h: 6.5       # centre of the morning ramp-up
  day_end_h: 21.5        # centre of the evening ramp-down
  ramp_width_h: 0.75     # ramp steepness (logistic scale)
  peaks:
    - {centre_h: 8.75, sigma_h: 1.0, extra_veh_h_lane: 90}   # morning rush
    - {centre_h: 18.0, sigma_h: 1.2, extra_veh_h_lane: 80}   # evening rush
side_weights: {north: 1.0, east: 1.0, south: 1.0, west: 1.0}
arrivals: poisson         # non-homogeneous Poisson process, rate = curve(t)

vehicle_mix:              # share of departures per vType (must sum to 1)
  car: 0.85
  van: 0.10
  truck: 0.05
