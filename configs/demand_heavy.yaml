# Heavy-volume scenario: ~107 % of the balanced profile (peak ~255 veh/h/lane).
#
# This is deliberately *beyond* the fixed per-approach timer's capacity: on the
# 3x3 grid the fixed 20 s program collapses into spillback gridlock from ~10:00
# (backlog 2,900 vehicles and 690 teleports by 11:40, no recovery after the peak).
# Balanced (240/lane) is the last level it survives, and 275/315 fail faster, so
# the capacity cliff is sharp. Treat this as the stress test: the question for the
# adaptive controller is whether it degrades more gracefully, not whether it is
# congestion-free.
name: heavy
seed: 42
time: {day_seconds: 86400, time_scale: 1.0, step_length_s: 1.0}
curve:
  night_veh_h_lane: 16
  day_veh_h_lane: 96
  day_start_h: 6.5       # centre of the morning ramp-up
  day_end_h: 21.5        # centre of the evening ramp-down
  ramp_width_h: 0.75     # ramp steepness (logistic scale)
  peaks:
    - {centre_h: 8.75, sigma_h: 1.0, extra_veh_h_lane: 160}   # morning rush
    - {centre_h: 18.0, sigma_h: 1.2, extra_veh_h_lane: 145}   # evening rush
side_weights: {north: 1.0, east: 1.0, south: 1.0, west: 1.0}
arrivals: poisson         # non-homogeneous Poisson process, rate = curve(t)

vehicle_mix:              # share of departures per vType (must sum to 1)
  car: 0.85
  van: 0.10
  truck: 0.05
